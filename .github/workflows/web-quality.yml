name: Verify HTML game browser regression

on:
  pull_request:
    paths:
      - 'src/webQuality.ts'
      - 'src/verificationFlow.ts'
      - 'benchmarks/**'
      - 'scripts/web_acceptance.mjs'
      - '.github/workflows/web-quality.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-quality:
    name: Offline browser acceptance controls
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test libraries
        run: npm install --no-audit --no-fund
      - name: Install isolated CI browser
        run: npx playwright install --with-deps chromium
      - name: Assert broken and working Minesweeper fixtures
        run: node scripts/web_acceptance.mjs --fixtures
      - name: Store browser verification report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localforge-browser-regression
          if-no-files-found: warn
          path: web-quality-artifacts/
          retention-days: 7
