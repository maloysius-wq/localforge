name: Smoke-test real CPU coding model

on:
  pull_request:
    paths:
      - 'src-tauri/src/lib.rs'
      - 'src/codeTasks.ts'
      - 'src/webQuality.ts'
      - 'src/verificationFlow.ts'
      - 'scripts/web_acceptance.mjs'
      - 'benchmarks/**'
      - 'scripts/model_smoke.py'
      - '.github/workflows/model-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-smoke:
    name: Generate one-file HTML with CPU Qwen model
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test harness
        run: npm install --no-audit --no-fund
      - name: Prepare isolated Chromium for browser quality measurement
        run: npx playwright install --with-deps chromium
      - name: Prepare pinned and verified CPU-only runtime
        run: python scripts/prepare_runtime.py
      - name: Run real model inference and inspect response
        run: python scripts/model_smoke.py
      - name: Save inference report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localforge-cpu-model-smoke
          if-no-files-found: warn
          path: |
            localforge-model-smoke-output.txt
            smoke-llama.log
            web-quality-artifacts/
          retention-days: 5
